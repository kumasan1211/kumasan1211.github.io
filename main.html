<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Overdrive</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', monospace; text-align: center; margin: 0; padding: 0; overflow-x: hidden; transition: background 0.5s; }
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #top-ui { position: sticky; top: 0; background: rgba(0, 5, 15, 0.9); padding: 15px 0; z-index: 100; border-bottom: 1px solid #0f04; backdrop-filter: blur(5px); }
        #display-container { background: rgba(0, 10, 20, 0.8); border: 2px solid #0f0; width: 85%; margin: 0 auto; padding: 15px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3.2rem; font-weight: bold; }
        #stats-bar { font-size: 1rem; color: #0a0; margin-top: 5px; }
        #overdrive-text { color: #f0f; font-weight: bold; font-size: 1.2rem; display: none; margin-top: 5px; text-shadow: 0 0 10px #f0f; }
        .gen-list { max-width: 750px; margin: 20px auto; padding: 0 20px 100px; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: rgba(20, 20, 20, 0.9); margin: 8px 0; padding: 12px 20px; border: 1px solid #333; border-radius: 8px; }
        .action-area { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn-base { border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; width: 100%; max-width: 400px; transition: 0.2s; }
        .prestige-btn { background: #004; color: #88f; border: 1px solid #00f; }
        .buy-btn { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px 15px; cursor: pointer; min-width: 130px; }
        .btn-base:disabled, .buy-btn:disabled { background: #222; color: #444; border-color: #333; cursor: not-allowed; }
        #auto-status { color: #ffcc00; font-weight: bold; margin-top: 5px; font-size: 0.9rem; }
        .white-out { background: #fff !important; color: #fff !important; }
    </style>
</head>
<body id="body">
    <canvas id="star-canvas"></canvas>
    <div id="top-ui">
        <div id="display-container">
            <div id="display">0.00 stars</div>
            <div id="stats-bar">
                <span id="ps-display">+0.00/s</span> | 
                <span style="color:#aaf" id="ip-display">IP: 0</span>
            </div>
            <div id="overdrive-text">OVERDRIVE: ACTIVE (x1000 SPEED)</div>
            <div id="auto-status">Autobuyer: LOCKED</div>
        </div>
        <div style="color: #888; font-size: 0.75rem; margin-top: 5px;">[1-8]:Buy | [M]:Max | [A]:Auto | [P]:Prestige | <span style="color:#f0f">[O]:HOLD TO ACCELERATE</span></div>
    </div>

    <div class="gen-list">
        <div id="gen-list-render"></div>
        <div class="action-area">
            <button class="btn-base prestige-btn" id="prestige-btn" onclick="prestige()">PRESTIGE [P]</button>
        </div>
    </div>

    <script>
        // --- 巨大数クラス (前回のまま) ---
        class BigNum {
            constructor(mag, exp) { this.mag = isNaN(mag) ? 0 : mag; this.exp = isNaN(exp) ? 0 : exp; this.normalize(); }
            normalize() {
                if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(Math.abs(this.mag));
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { if(other.mag > 0) { this.mag = other.mag; this.exp = other.exp; } return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(2);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let stars, generators, ip, permanentPower, autoActive = false, overdrive = false, lastUpdate = Date.now();

        function initData() {
            stars = new BigNum(1, 1);
            if (ip === undefined) ip = 0;
            if (permanentPower === undefined) permanentPower = 1.0;
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators.amount = new BigNum(1, 0);
        }

        function checkInfinity() {
            if (stars.exp >= 308 && (stars.exp > 308 || stars.mag >= 1.79)) {
                ip += 1;
                document.getElementById("body").classList.add("white-out");
                setTimeout(() => { document.getElementById("body").classList.remove("white-out"); initData(); }, 500);
            }
        }

        function prestige() {
            let gain = stars.exp < 38 ? 1.0 : Math.pow(stars.exp / 64, 0.063);
            if (gain <= 1.0) return;
            permanentPower = gain;
            initData();
        }

        function buy(i) {
            let g = generators[i];
            if (stars.gte(g.cost)) {
                stars.minus(g.cost); g.amount.plus(new BigNum(1, 0)); g.bought++;
                g.cost.times(g.costMult); if (g.bought % 10 === 0) g.prodMult.times(2);
                return true;
            } return false;
        }

        function buyMaxAll() {
            for (let i = 7; i >= 0; i--) {
                while (stars.gte(generators[i].cost)) { buy(i); }
            }
        }

        // キー入力監視 (Overdrive対応)
        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            if (k >= "1" && k <= "8") buy(parseInt(k)-1);
            if (k === "m") buyMaxAll();
            if (k === "a" && ip > 0) autoActive = !autoActive;
            if (k === "p") prestige();
            if (k === "o") overdrive = true;
        });
        window.addEventListener("keyup", (e) => {
            if (e.key.toLowerCase() === "o") overdrive = false;
        });

        function gameLoop() {
            const now = Date.now();
            let diff = (now - lastUpdate) / 1000;
            lastUpdate = now;

            // [O]キーで1000倍速
            if (overdrive) {
                diff *= 1000;
                document.getElementById("overdrive-text").style.display = "block";
            } else {
                document.getElementById("overdrive-text").style.display = "none";
                diff = Math.min(diff, 1); // 通常時は1秒制限
            }

            if (autoActive && ip > 0) buyMaxAll();

            for (let i = 7; i > 0; i--) {
                let m = BigNum.copy(generators[i].prodMult).times(permanentPower);
                generators[i-1].amount.plus(BigNum.copy(generators[i].amount).times(m).times(diff));
            }
            let gain = BigNum.copy(generators.amount).times(generators.prodMult).times(permanentPower);
            stars.plus(BigNum.copy(gain).times(diff));
            
            checkInfinity();
            updateUI(gain);
        }

        function updateUI(gain) {
            document.getElementById("display").innerText = stars.toString() + " stars";
            document.getElementById("ps-display").innerText = "+" + gain.toString() + "/s";
            document.getElementById("ip-display").innerText = `IP: ${ip} (Power: x${permanentPower.toFixed(3)})`;
            
            let status = document.getElementById("auto-status");
            if (ip === 0) status.innerText = "Autobuyer: LOCKED (Reach e308)";
            else status.innerText = "Autobuyer: " + (autoActive ? "ON" : "OFF") + " [A]";

            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
                document.getElementById(`cost-${i}`).innerText = gen.cost.toString();
                document.getElementById(`buy-btn-${i}`).disabled = !stars.gte(gen.cost);
            });
        }

        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars_bg = [];
        function initStars() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; stars_bg = Array.from({length:80}, () => ({x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:Math.random()*0.4})); }
        function draw() { ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; stars_bg.forEach(s=>{ctx.fillRect(s.x,s.y,1,1); s.y=(s.y+s.v)%canvas.height;}); requestAnimationFrame(draw); }

        initData(); initStars(); draw();
        document.getElementById("gen-list-render").innerHTML = generators.map((_, i) => `<div class="gen-row" id="row-${i}"><div><strong>Gen ${i+1}</strong><br><small id="amt-${i}">0</small></div><button class="buy-btn" id="buy-btn-${i}" onclick="buy(${i})">Buy (Cost: <span id="cost-${i}">0</span>)</button></div>`).join('');
        setInterval(gameLoop, 50);
    </script>
</body>
</html>
