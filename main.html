<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Full Fixed</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', monospace; text-align: center; margin: 0; padding: 20px; overflow: hidden; }
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #display-container { background: rgba(0, 10, 20, 0.8); border: 2px solid #0f0; width: 85%; margin: 10px auto; padding: 20px; box-shadow: 0 0 20px #0f04; }
        #display { font-size: 3.5rem; font-weight: bold; }
        #ps-display { font-size: 1.2rem; color: #0a0; }
        #sacrifice-container { margin: 15px auto; padding: 15px; border: 2px solid #f00; background: rgba(80, 0, 0, 0.4); max-width: 600px; }
        .sac-btn { background: #f00; color: #fff; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        .sac-btn:hover:not(:disabled) { background: #ff4444; box-shadow: 0 0 15px #f00; }
        .sac-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .gen-list { max-width: 750px; margin: 0 auto; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: rgba(20, 20, 20, 0.9); margin: 6px 0; padding: 10px 20px; border: 1px solid #333; border-radius: 8px; transition: 0.1s; }
        .gen-row.flash { border-color: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.02); }
        .buy-btn { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px 15px; cursor: pointer; min-width: 120px; }
        .buy-btn:hover:not(:disabled) { background: #0f0; color: #000; }
        .buy-btn:disabled { border-color: #444; color: #444; }
        .key-badge { background: #333; color: #fff; padding: 2px 6px; border: 1px solid #555; margin-right: 8px; font-size: 0.8rem; }
        #save-popup { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #0f0; color: #000; padding: 5px 20px; font-weight: bold; opacity: 0; transition: 0.5s; z-index: 1000; }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>
    <div id="save-popup">SAVED</div>

    <div id="display-container">
        <div id="display">0.0</div>
        <div id="ps-display">+0.0 / sec</div>
    </div>
    
    <div id="sacrifice-container">
        <button class="sac-btn" id="sac-btn-main" onclick="sacrifice()">SACRIFICE (B)<br><span id="sac-bonus" style="font-size: 0.8rem;">x1.00 bonus to Gen 8</span></button>
    </div>

    <div style="margin: 10px; color: #888; font-size: 0.8rem;">[1-8]:購入 | [M]:最大 | [S]:セーブ | [B]:犠牲 | [R]:完全リセット</div>

    <div class="gen-list" id="gen-list"></div>

    <script>
        class BigNum {
            constructor(mag, exp) { 
                this.mag = isNaN(mag) ? 0 : mag; 
                this.exp = isNaN(exp) ? 0 : exp; 
                this.normalize(); 
            }
            normalize() {
                if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(Math.abs(this.mag));
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { this.mag = other.mag; this.exp = other.exp; return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(1);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let points, sacrificeMult, generators, lastUpdate = Date.now();

        function initData() {
            points = new BigNum(1, 1);
            sacrificeMult = new BigNum(1, 0);
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators[0].amount = new BigNum(1, 0);
        }

        // キーボード監視
        window.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            if (key >= "1" && key <= "8") { let i = parseInt(key)-1; if(buy(i)) flashRow(i); }
            if (key === "m") buyMaxAll();
            if (key === "s") saveGame(true);
            if (key === "b") sacrifice();
            if (key === "r") hardReset();
        });

        function buy(i) {
            let g = generators[i];
            if (points.gte(g.cost)) {
                points.minus(g.cost); g.amount.plus(new BigNum(1, 0)); g.bought++;
                g.cost.times(g.costMult); if (g.bought % 10 === 0) g.prodMult.times(2);
                return true;
            } return false;
        }

        function buyMaxAll() {
            let any = false;
            for (let i = 7; i >= 0; i--) {
                let bought = false;
                while (points.gte(generators[i].cost)) { buy(i); bought = true; any = true; }
                if (bought) flashRow(i);
            }
        }

        function flashRow(i) {
            const el = document.getElementById(`row-${i}`);
            if(el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 150); }
        }

        function sacrifice() {
            let exp = generators[0].amount.exp;
            if (exp < 10) return;
            sacrificeMult = new BigNum(Math.pow(exp / 10, 2), 0);
            for (let i = 0; i < 7; i++) {
                generators[i].amount = new BigNum(0, 0);
                generators[i].bought = 0;
                generators[i].cost = new BigNum(config[i].base, 0);
                generators[i].prodMult = new BigNum(1, 0);
            }
            flashRow(7);
        }

        function gameLoop() {
            const now = Date.now();
            const diff = Math.min((now - lastUpdate) / 1000, 1);
            lastUpdate = now;
            for (let i = 7; i > 0; i--) {
                let m = (i === 7) ? BigNum.copy(generators[i].prodMult).times(sacrificeMult) : generators[i].prodMult;
                generators[i-1].amount.plus(BigNum.copy(generators[i].amount).times(m).times(diff));
            }
            let gain = BigNum.copy(generators[0].amount).times(generators[0].prodMult);
            points.plus(BigNum.copy(gain).times(diff));
            updateUI(gain);
        }

        function updateUI(gain) {
            document.getElementById("display").innerText = points.toString();
            document.getElementById("ps-display").innerText = `+${gain.toString()} / sec`;
            let sacB = (generators[0].amount.exp < 10) ? new BigNum(1,0) : new BigNum(Math.pow(generators[0].amount.exp / 10, 2), 0);
            document.getElementById("sac-bonus").innerText = `x${sacB.toString()} bonus to Gen 8`;
            document.getElementById("sac-btn-main").disabled = sacB.exp === 0 && sacB.mag <= 1.01;
            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
                document.getElementById(`cost-${i}`).innerText = gen.cost.toString();
                document.getElementById(`buy-btn-${i}`).disabled = !points.gte(gen.cost);
            });
        }

        // 背景
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars_bg = [];
        function initStars() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars_bg = Array.from({length:100}, () => ({x:Math.random()*canvas.width, y:Math.random()*canvas.height, v:Math.random()*0.5}));
        }
        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#fff'; stars_bg.forEach(s=>{ctx.fillRect(s.x,s.y,1,1); s.y=(s.y+s.v)%canvas.height;});
            requestAnimationFrame(draw);
        }

        function saveGame(show) {
            const data = { p:points, sm:sacrificeMult, g:generators, t:Date.now() };
            localStorage.setItem("starSaveFinal", JSON.stringify(data));
            if(show){ const p=document.getElementById("save-popup"); p.style.opacity=1; setTimeout(()=>p.style.opacity=0,1000); }
        }
        function loadGame() {
            const d = JSON.parse(localStorage.getItem("starSaveFinal"));
            if(!d) return;
            try {
                points = new BigNum(d.p.mag, d.p.exp);
                sacrificeMult = new BigNum(d.sm.mag, d.sm.exp);
                d.g.forEach((g,i) => {
                    generators[i].amount = new BigNum(g.amount.mag, g.amount.exp);
                    generators[i].bought = g.bought;
                    generators[i].cost = new BigNum(g.cost.mag, g.cost.exp);
                    generators[i].prodMult = new BigNum(g.prodMult.mag, g.prodMult.exp);
                });
            } catch(e) { initData(); }
        }
        function hardReset() { if(confirm("REALLY RESET?")){localStorage.clear(); location.reload();} }

        initData();
        loadGame();
        initStars();
        draw();
        document.getElementById("gen-list").innerHTML = generators.map((_, i) => `<div class="gen-row" id="row-${i}"><div><span class="key-badge">${i+1}</span><strong>Gen ${i+1}</strong><br><small>Amt: <span id="amt-${i}">0</span></small></div><button class="buy-btn" id="buy-btn-${i}" onclick="if(buy(${i}))flashRow(${i})">Buy (Cost: <span id="cost-${i}">0</span>)</button></div>`).join('');
        window.onresize = initStars;
        setInterval(gameLoop, 50);
        setInterval(()=>saveGame(false), 10000);
    </script>
</body>
</html>
