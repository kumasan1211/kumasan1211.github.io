<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BreakEternity 完全動作版</title>
    <!-- ライブラリ本体を直接ここに埋め込みます（一部抜粋・簡略版ですが動作します） -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #111; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; }
        #display { font-size: 3rem; margin: 30px; border: 1px solid #0f0; padding: 20px; box-shadow: 0 0 15px #0f0; }
        button { background: #000; color: #0f0; border: 2px solid #0f0; padding: 20px 40px; cursor: pointer; font-size: 1.5rem; transition: 0.2s; }
        button:hover { background: #0f0; color: #000; }
        #log { margin-top: 20px; color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

    <h1>EE-CLICKER v1.0</h1>
    <div id="display">1.00e10</div>
    <button id="mainButton">数値を2乗する (^2)</button>
    <div id="log">Console: Ready.</div>

    <script>
        // ライブラリが読み込めていない場合の予備処理
        window.onload = function() {
            if (typeof Decimal === 'undefined') {
                document.getElementById('display').innerHTML = "<span style='color:red'>ライブラリ読込失敗</span>";
                document.getElementById('log').innerText = "CDNからの読み込みに失敗しました。ネット接続を確認してください。";
                return;
            }

            // --- ゲームのメイン処理 ---
            let points = new Decimal(10); // 初期値 10

            const displayEl = document.getElementById("display");
            const btn = document.getElementById("mainButton");
            const logEl = document.getElementById("log");

            function updateDisplay() {
                // 指数が 100,000,000 (1e8) を超えたら ee表記にする
                if (points.exponent >= 100000000) {
                    let ee = Math.log10(points.exponent).toFixed(6);
                    displayEl.innerText = "ee" + ee;
                } 
                // 指数が 100,000 を超えたら e...e... 表記
                else if (points.exponent >= 100000) {
                    displayEl.innerText = "e" + points.exponent.toLocaleString();
                }
                // それ以外は通常の指数表記
                else {
                    displayEl.innerText = points.toString();
                }
                logEl.innerText = "Current Exponent: " + points.exponent;
            }

            btn.onclick = function() {
                // 数値を2乗（pow(2)）する
                points = points.pow(2);
                updateDisplay();
                console.log("Success! Points are now:", points.toString());
            };

            // 初回表示
            updateDisplay();
        };
    </script>
</body>
</html>
