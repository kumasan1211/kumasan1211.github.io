<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Turbo Idle: Table Edition</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        #display-container { background: #111; border: 2px solid #0f0; width: 85%; margin: 20px auto; padding: 20px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3rem; font-weight: bold; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; margin: 8px 0; padding: 12px; border: 1px solid #333; }
        .gen-info { text-align: left; }
        .gen-name { font-size: 1.1rem; color: #fff; font-weight: bold; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; width: 260px; font-weight: bold; }
        button:hover:not(:disabled) { background: #0f0; color: #000; }
        button:disabled { border-color: #444; color: #444; cursor: not-allowed; }
        .cost-text { font-size: 0.9rem; color: #ffcc00; }
    </style>
</head>
<body>

    <div id="display-container">
        <div style="color: #888; letter-spacing: 2px;">ANTIMATTER</div>
        <div id="display">0.0</div>
    </div>

    <div id="gen-list"></div>

    <script>
        // 巨大数クラス
        class BigNum {
            constructor(mag, exp) { this.mag = mag; this.exp = exp; this.normalize(); }
            normalize() {
                if (this.mag <= 0) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(this.mag);
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { this.mag = other.mag; this.exp = other.exp; return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 1) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            // 表示用メソッド
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 6) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(1).toLocaleString();
            }
        }

        // 初期ポイント：10
        let points = new BigNum(1, 1);

        // 指定のコストテーブル
        const config = [
            { base: 2,           mult: 2 },
            { base: 16,          mult: 4 },
            { base: 512,         mult: 8 },
            { base: 65536,       mult: 16 },
            { base: 3.355e7,     mult: 32 },
            { base: 6.871e10,    mult: 64 },
            { base: 5.629e14,    mult: 128 },
            { base: 1.844e19,    mult: 256 }
        ];

        let generators = config.map((c, i) => ({
            amount: new BigNum(0, 0),
            bought: 0,
            cost: new BigNum(c.base, 0),     // 初期コスト（数値そのもの）
            costMult: new BigNum(c.mult, 0), // 増加倍率
            prodMult: new BigNum(1, 0)
        }));

        // Gen 1 を1つ持ってスタート
        generators[0].amount = new BigNum(1, 0);

        const listEl = document.getElementById("gen-list");
        generators.forEach((gen, i) => {
            listEl.innerHTML += `
                <div class="gen-row">
                    <div class="gen-info">
                        <div class="gen-name">Normal Generator ${i+1}</div>
                        <div style="font-size:0.8rem">Amt: <span id="amt-${i}">0</span> (x<span id="mult-${i}">1.0</span>)</div>
                    </div>
                    <button id="buy-${i}" onclick="buy(${i})">
                        Buy 1<br>
                        <span class="cost-text">Cost: <span id="cost-${i}">0</span></span>
                    </button>
                </div>
            `;
        });

        function buy(i) {
            let g = generators[i];
            // points >= g.cost の判定
            if (points.exp > g.cost.exp || (points.exp === g.cost.exp && points.mag >= g.cost.mag)) {
                points.minus(g.cost);
                g.amount.plus(new BigNum(1, 0));
                g.bought++;
                
                // コストを倍増させる
                g.cost.times(g.costMult);
                
                // 10個ごとに生産力2倍
                if (g.bought % 10 === 0) g.prodMult.times(2);
                update();
            }
        }

        function gameLoop() {
            for (let i = 7; i > 0; i--) {
                let p = new BigNum(generators[i].amount.mag, generators[i].amount.exp)
                           .times(generators[i].prodMult).times(0.1);
                generators[i-1].amount.plus(p);
            }
            let p = new BigNum(generators[0].amount.mag, generators[0].amount.exp)
                        .times(generators[0].prodMult).times(0.1);
            points.plus(p);
            update();
        }

        function update() {
            document.getElementById("display").innerText = points.toString();
            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
                document.getElementById(`mult-${i}`).innerText = gen.prodMult.toString();
                document.getElementById(`cost-${i}`).innerText = gen.cost.toString();
                
                // ボタンの有効無効
                let canBuy = points.exp > gen.cost.exp || (points.exp === gen.cost.exp && points.mag >= gen.cost.mag);
                document.getElementById(`buy-${i}`).disabled = !canBuy;
            });
        }

        setInterval(gameLoop, 100);
    </script>
</body>
</html>
