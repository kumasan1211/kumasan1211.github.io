<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Turbo Idle - Ascension</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        #display { font-size: 2.5rem; margin: 10px; color: #00e5ff; text-shadow: 0 0 10px #00e5ff; }
        .container { max-width: 800px; margin: 0 auto; background: #111; padding: 20px; border: 1px solid #333; }
        .dimension-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #222; padding: 5px; }
        .dim-name { width: 160px; text-align: left; font-weight: bold; }
        .dim-amount { flex-grow: 1; text-align: right; margin-right: 20px; font-family: monospace; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 5px 15px; cursor: pointer; width: 180px; }
        button:hover:not(:disabled) { background: #444; border-color: #00e5ff; }
        button:disabled { color: #555; cursor: not-allowed; }
        .upgrade-bar { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        #ascension-btn { background: #4a00e0; color: #fff; border: 2px solid #8e2de2; width: 300px; height: 50px; font-weight: bold; }
        #ascension-btn:hover:not(:disabled) { background: #8e2de2; box-shadow: 0 0 15px #8e2de2; }
    </style>
</head>
<body>

    <h1>Turbo Idle: Ascension</h1>
    <div id="display">10.00 AM</div>
    <div id="ascension-info" style="color: #8e2de2; font-weight: bold;">Ascension Mult: x1.00</div>
    <div id="tick-info">Tick Speed: 1000ms</div>

    <div class="container" id="dim-container"></div>

    <div class="upgrade-bar">
        <button id="tick-btn" onclick="buyTickSpeed()">Buy TickSpeed (Cost: e3)</button>
        <!-- アセンションボタン -->
        <button id="ascension-btn" onclick="ascend()">Ascend<br>(Require e10 AM)</button>
    </div>

    <script>
        class ADNumber {
            constructor(mag, exp) { this.mag = mag; this.exp = exp; this.normalize(); }
            normalize() {
                if (this.mag <= 0) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(this.mag);
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { this.mag = other.mag; this.exp = other.exp; return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            times(n) { this.mag *= n; this.normalize(); return this; }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(4);
                if (this.exp >= 10000) return "e" + Math.floor(this.exp).toLocaleString();
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp);
                return (this.mag * Math.pow(10, this.exp)).toFixed(1);
            }
        }

        let antimatter = new ADNumber(1, 1);
        let tickSpeed = 1000;
        let tickCost = new ADNumber(1, 3);
        let ascensionMult = new ADNumber(1, 0); // アセンション倍率
        let dimensions = [];

        function initDimensions() {
            dimensions = [];
            for (let i = 0; i < 8; i++) {
                dimensions.push({
                    amount: new ADNumber(0, 0),
                    bought: 0,
                    multiplier: new ADNumber(1, 0),
                    cost: new ADNumber(1, Math.pow(i + 1, 2))
                });
            }
            dimensions[0].amount = new ADNumber(1, 0);
        }

        function createUI() {
            const container = document.getElementById("dim-container");
            container.innerHTML = "";
            dimensions.forEach((dim, i) => {
                container.innerHTML += `
                    <div class="dimension-row">
                        <div class="dim-name">Normal Gen ${i+1}</div>
                        <div class="dim-amount" id="amt-${i}">0</div>
                        <button id="buy-${i}" onclick="buyDim(${i})">Buy (Cost: <span id="cost-${i}">0</span>)</button>
                    </div>
                `;
            });
        }

        function buyDim(i) {
            if (antimatter.exp >= dimensions[i].cost.exp) {
                dimensions[i].amount.plus(new ADNumber(1, 0));
                dimensions[i].bought++;
                if (dimensions[i].bought % 10 === 0) dimensions[i].multiplier.times(2);
                updateUI();
            }
        }

        function buyTickSpeed() {
            if (antimatter.exp >= tickCost.exp) {
                tickSpeed *= 0.99;
                tickCost.exp *= 1.5;
                updateUI();
            }
        }

        // アセンション関数
        function ascend() {
            if (antimatter.exp < 10) return;
            
            // 倍率の計算: AMの指数に基づいて増加 (例: e10で2倍, e20で3倍...)
            let gain = Math.max(1, Math.floor(antimatter.exp / 5));
            ascensionMult.plus(new ADNumber(gain, 0));

            // リセット
            antimatter = new ADNumber(1, 1);
            tickSpeed = 1000;
            tickCost = new ADNumber(1, 3);
            initDimensions();
            updateUI();
        }

        function gameLoop() {
            let globalMult = ascensionMult; // アセンション倍率を適用

            for (let i = 7; i > 0; i--) {
                let prod = new ADNumber(dimensions[i].amount.mag, dimensions[i].amount.exp)
                           .times(dimensions[i].multiplier.mag * 0.1)
                           .times(globalMult.mag); // 倍率適用
                dimensions[i-1].amount.plus(prod);
            }
            let pProd = new ADNumber(dimensions[0].amount.mag, dimensions[0].amount.exp)
                        .times(dimensions[0].multiplier.mag * 0.1)
                        .times(globalMult.mag); // 倍率適用
            antimatter.plus(pProd);

            if (antimatter.exp > 1000) antimatter.exp *= 1.001;
            updateUI();
        }

        function updateUI() {
            document.getElementById("display").innerText = antimatter.toString() + " AM";
            document.getElementById("ascension-info").innerText = "Ascension Mult: x" + ascensionMult.toString();
            document.getElementById("tick-info").innerText = "Tick Speed: " + tickSpeed.toFixed(1) + "ms";
            document.getElementById("tick-btn").innerText = "Buy TickSpeed (Cost: " + tickCost.toString() + ")";
            document.getElementById("ascension-btn").disabled = antimatter.exp < 10;
            
            dimensions.forEach((dim, i) => {
                document.getElementById(`amt-${i}`).innerText = dim.amount.toString();
                document.getElementById(`cost-${i}`).innerText = dim.cost.toString();
                document.getElementById(`buy-${i}`).disabled = antimatter.exp < dim.cost.exp;
            });
        }

        initDimensions();
        createUI();
        setInterval(gameLoop, 100);
    </script>
</body>
</html>
