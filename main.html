<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Core Fix</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', monospace; text-align: center; margin: 0; padding: 0; overflow-x: hidden; }
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #top-ui { position: sticky; top: 0; background: rgba(0, 5, 15, 0.9); padding: 15px 0; z-index: 100; border-bottom: 1px solid #0f04; backdrop-filter: blur(5px); }
        #display-container { background: rgba(0, 10, 20, 0.8); border: 2px solid #0f0; width: 85%; margin: 0 auto; padding: 15px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3.2rem; font-weight: bold; }
        #stats-bar { font-size: 1rem; color: #0a0; margin-top: 5px; }
        #overdrive-text { color: #f0f; font-weight: bold; display: none; }
        .gen-list { max-width: 750px; margin: 20px auto; padding: 0 20px 100px; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: rgba(20, 20, 20, 0.9); margin: 8px 0; padding: 12px 20px; border: 1px solid #333; border-radius: 8px; }
        .buy-btn { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px 15px; cursor: pointer; min-width: 130px; }
        .buy-btn:disabled { color: #444; border-color: #333; }
        .sac-area { margin: 15px 0; padding: 10px; border: 2px solid #f00; background: #300; display: inline-block; width: 80%; max-width: 500px; }
    </style>
</head>
<body id="body">
    <canvas id="star-canvas"></canvas>
    <div id="top-ui">
        <div id="display-container">
            <div id="display">0.00 stars</div>
            <div id="stats-bar"><span id="ps-display">+0.00/s</span> | <span id="pow-display">Power: x1.000</span></div>
            <div id="overdrive-text">OVERDRIVE ACTIVE (x1000)</div>
        </div>
        <div style="font-size: 0.8rem; margin-top: 5px; color: #888;">[1-8]:Buy | [M]:Max | [B]:Sacrifice | [P]:Prestige | [O]:Hold to Fast</div>
    </div>

    <div class="gen-list">
        <div id="gen-list-render"></div>
        <div class="sac-area">
            <button onclick="sacrifice()" id="sac-btn" style="background:#f00; color:#fff; border:none; padding:10px 20px; font-weight:bold; cursor:pointer;">SACRIFICE [B]</button>
            <div id="sac-bonus-text" style="font-size:0.8rem; margin-top:5px;">Next: x1.00 to Gen 8</div>
        </div>
        <div style="margin:20px;"><button onclick="prestige()" id="prestige-btn" style="background:#00f; color:#fff; border:none; padding:15px; cursor:pointer; font-weight:bold; width:300px;">PRESTIGE [P]</button></div>
    </div>

    <script>
// --- BigNum クラスに比較用メソッドを確実に追加 ---
class BigNum {
    constructor(mag, exp) { 
        this.mag = isNaN(mag) ? 0 : mag; 
        this.exp = isNaN(exp) ? 0 : exp; 
        this.normalize(); 
    }
    normalize() {
        if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
        let log = Math.log10(Math.abs(this.mag));
        this.exp += Math.floor(log);
        this.mag = Math.pow(10, log - Math.floor(log));
    }
    // 比較メソッド: これが正しくないとボタンが押せません
    gte(other) {
        if (this.exp > other.exp) return true;
        if (this.exp < other.exp) return false;
        return this.mag >= other.mag - 1e-10; // 誤差を考慮
    }
    // 以下、plus, minus, times, toString は前回のものを維持
}

// --- プレステージ実行関数の強化 ---
function prestige() {
    let gain = getPrestigeGain();
    if (gain <= 1.0001) {
        console.log("プレステージ条件(e38)未達です");
        return;
    }
    permanentPower = gain;
    initData(); // ここで全リセット＋Gen1を1つ付与
    console.log("Prestige Success! New Power: x" + permanentPower);
}

// --- 犠牲実行関数の強化 ---
function sacrifice() {
    let bonus = getSacBonus();
    // 倍率が1.0倍より大きく、かつGen1が10桁(e10)以上あること
    if (bonus.mag <= 1.0 && bonus.exp === 0) return;
    
    sacrificeMult = bonus;
    // 第1～7次元をリセット
    for (let i = 0; i < 7; i++) {
        generators[i].amount = new BigNum(0, 0);
        generators[i].bought = 0;
        generators[i].cost = new BigNum(config[i].base, 0);
        generators[i].prodMult = new BigNum(1, 0);
    }
    // 重要：犠牲後に生産が止まらないようGen1を1つ戻す
    generators[0].amount = new BigNum(1, 0);
    console.log("Sacrifice Success!");
}

// --- UI更新でのボタン有効化判定 ---
function updateUI(gain, power) {
    // プレステージボタンの判定
    let gainNext = getPrestigeGain();
    let pBtn = document.getElementById("prestige-btn");
    if (pBtn) {
        pBtn.disabled = (stars.exp < 38); // e38未満は無効
        pBtn.innerText = `PRESTIGE [P] (Next: x${gainNext.toFixed(3)})`;
    }

    // 犠牲ボタンの判定
    let sacB = getSacBonus();
    let sBtn = document.getElementById("sac-btn");
    if (sBtn) {
        sBtn.disabled = (generators[0].amount.exp < 10); // e10未満は無効
        document.getElementById("sac-bonus-text").innerText = `Next: x${sacB.toString()} to Gen 8`;
    }
}

            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { if(other.mag > 0) { this.mag = other.mag; this.exp = other.exp; } return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(2);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let stars, generators, sacrificeMult, permanentPower, lastUpdate = Date.now(), overdrive = false;

        function initData() {
            stars = new BigNum(1, 1);
            sacrificeMult = new BigNum(1, 0);
            if (permanentPower === undefined) permanentPower = 1.0;
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators[0].amount = new BigNum(1, 0); // リセット後必ず1つ持たせる
        }

        function buy(i) {
            let g = generators[i];
            if (stars.gte(g.cost)) {
                stars.minus(g.cost); g.amount.plus(new BigNum(1, 0)); g.bought++;
                g.cost.times(g.costMult); if (g.bought % 10 === 0) g.prodMult.times(2);
                return true;
            } return false;
        }

        function buyMaxAll() {
            for (let i = 7; i >= 0; i--) { while (stars.gte(generators[i].cost)) buy(i); }
        }

        function sacrifice() {
            let exp = generators[0].amount.exp;
            if (exp < 10) return;
            sacrificeMult = new BigNum(Math.pow(exp / 10, 2), 0);
            for (let i = 0; i < 7; i++) {
                generators[i].amount = new BigNum(0, 0);
                generators[i].bought = 0;
                generators[i].cost = new BigNum(config[i].base, 0);
                generators[i].prodMult = new BigNum(1, 0);
            }
            generators[0].amount = new BigNum(1, 0); // 犠牲後もGen1は残す
        }

        function prestige() {
            let gain = stars.exp < 38 ? 1.0 : Math.pow(stars.exp / 64, 0.063);
            if (gain <= 1.0) return;
            permanentPower = gain;
            initData();
        }

        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            if (k >= "1" && k <= "8") buy(parseInt(k)-1);
            if (k === "m") buyMaxAll();
            if (k === "b") sacrifice();
            if (k === "p") prestige();
            if (k === "o") overdrive = true;
        });
        window.addEventListener("keyup", (e) => { if (e.key === "o") overdrive = false; });

        function gameLoop() {
            const now = Date.now();
            let diff = (now - lastUpdate) / 1000;
            lastUpdate = now;
            if (overdrive) { diff *= 1000; document.getElementById("overdrive-text").style.display = "block"; }
            else { document.getElementById("overdrive-text").style.display = "none"; diff = Math.min(diff, 1); }

            let power = permanentPower || 1.0;

            for (let i = 7; i > 0; i--) {
                let m = BigNum.copy(generators[i].prodMult).times(power);
                if (i === 7) m.times(sacrificeMult);
                generators[i-1].amount.plus(BigNum.copy(generators[i].amount).times(m).times(diff));
            }
            let gainPerSec = BigNum.copy(generators[0].amount).times(generators[0].prodMult).times(power);
            stars.plus(BigNum.copy(gainPerSec).times(diff));

            updateUI(gainPerSec, power);
        }

        function updateUI(gain, power) {
            document.getElementById("display").innerText = stars.toString() + " stars";
            document.getElementById("ps-display").innerText = "+" + gain.toString() + "/s";
            document.getElementById("pow-display").innerText = "Power: x" + power.toFixed(3);
            
            let nextSac = generators[0].amount.exp < 10 ? 1 : Math.pow(generators[0].amount.exp / 10, 2);
            document.getElementById("sac-bonus-text").innerText = `Next: x${nextSac.toFixed(2)} to Gen 8`;
            document.getElementById("sac-btn").disabled = generators[0].amount.exp < 10;
            
            let nextP = stars.exp < 38 ? 1.0 : Math.pow(stars.exp / 64, 0.063);
            document.getElementById("prestige-btn").disabled = nextP <= 1.0;
            document.getElementById("prestige-btn").innerText = `PRESTIGE [P] (Next: x${nextP.toFixed(3)})`;

            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
                document.getElementById(`cost-${i}`).innerText = gen.cost.toString();
                document.getElementById(`buy-btn-${i}`).disabled = !stars.gte(gen.cost);
            });
        }

        initData();
        document.getElementById("gen-list-render").innerHTML = generators.map((_, i) => `<div class="gen-row"><div><strong>Gen ${i+1}</strong><br><small id="amt-${i}">0</small></div><button class="buy-btn" id="buy-btn-${i}" onclick="buy(${i})">Buy (Cost: <span id="cost-${i}">0</span>)</button></div>`).join('');
        setInterval(gameLoop, 50);

        // 背景Canvas描画
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        function initStars() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        initStars();
        function draw() { ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; for(let i=0;i<50;i++) ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,1,1); requestAnimationFrame(draw); }
        draw();
    </script>
</body>
</html>
