<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BreakEternity Test</title>
    <!-- 1. ライブラリを最新の信頼できるリンクに変更 -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        #display { font-size: 3rem; margin: 30px; border: 1px solid #333; padding: 20px; }
        button { background: #222; color: #0f0; border: 2px solid #0f0; padding: 20px 40px; cursor: pointer; font-size: 1.5rem; }
        button:active { background: #0f0; color: #000; }
        #error-msg { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>巨大数カウンター</h1>
    <div id="error-msg"></div>
    <div id="display">読み込み中...</div>
    <button id="btn">数値を2乗する (^2)</button>

    <script>
        // ライブラリが読み込まれているかチェック
        if (typeof Decimal === 'undefined') {
            document.getElementById('error-msg').innerText = "エラー: BreakEternity.js が読み込めていません。インターネット接続を確認してください。";
        }

        // 初期値 10
        let points = new Decimal(10);

        function update() {
            const el = document.getElementById("display");
            
            // 指数が 100,000 (1e5) を超えたら ee表記にする
            // (テスト用に少し早めに ee になるように設定しました)
            if (points.exponent >= 100000) {
                let eeValue = Math.log10(points.exponent).toFixed(4);
                el.innerText = "ee" + eeValue;
            } else {
                // 通常の指数表記 (1.23e456)
                el.innerText = points.toString();
            }
        }

        // ボタンクリック時の処理
        document.getElementById("btn").onclick = function() {
            // points を 2乗する
            points = points.pow(2);
            update();
            console.log("Current Points:", points.toString());
        };

        // 最初の表示
        update();
    </script>
</body>
</html>
