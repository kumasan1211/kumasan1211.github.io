<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Save Edition</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        #display-container { background: #111; border: 2px solid #0f0; width: 85%; margin: 20px auto; padding: 20px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3rem; font-weight: bold; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; margin: 8px 0; padding: 12px; border: 1px solid #333; }
        .gen-info { text-align: left; width: 30%; }
        .btn-group { display: flex; gap: 10px; width: 60%; justify-content: flex-end; }
        button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px; cursor: pointer; font-weight: bold; flex: 1; }
        button:hover:not(:disabled) { background: #0f0; color: #000; }
        button:disabled { border-color: #444; color: #444; cursor: not-allowed; }
        .save-bar { margin: 20px; display: flex; justify-content: center; gap: 20px; }
        .save-btn { background: #333; border-color: #888; color: #fff; width: 150px; }
    </style>
</head>
<body>

    <div class="save-bar">
        <button class="save-btn" onclick="saveGame()">セーブ</button>
        <button class="save-btn" onclick="loadGame()">ロード</button>
        <button class="save-btn" style="border-color: #f00; color: #f00;" onclick="hardReset()">データ全消去</button>
    </div>

    <div id="display-container">
        <div style="color: #888; letter-spacing: 2px;">STARS</div>
        <div id="display">0.0</div>
    </div>

    <div id="gen-list"></div>

    <script>
        class BigNum {
            constructor(mag, exp) { this.mag = mag; this.exp = exp; this.normalize(); }
            normalize() {
                if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(this.mag);
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { this.mag = other.mag; this.exp = other.exp; return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(1);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        let points = new BigNum(1, 1);
        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let generators = [];

        function initData() {
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators[0].amount = new BigNum(1, 0);
            points = new BigNum(1, 1);
        }

        // セーブ機能
        function saveGame() {
            const saveData = {
                points: { mag: points.mag, exp: points.exp },
                gens: generators.map(g => ({
                    amount: { mag: g.amount.mag, exp: g.amount.exp },
                    bought: g.bought,
                    cost: { mag: g.cost.mag, exp: g.exp }, // BigNumクラスを分解
                    cost: { mag: g.cost.mag, exp: g.cost.exp },
                    prodMult: { mag: g.prodMult.mag, exp: g.prodMult.exp }
                }))
            };
            localStorage.setItem("starIdleSave", JSON.stringify(saveData));
            console.log("Game Saved!");
        }

        // ロード機能
        function loadGame() {
            const raw = localStorage.getItem("starIdleSave");
            if (!raw) return;
            const data = JSON.parse(raw);
            points = new BigNum(data.points.mag, data.points.exp);
            data.gens.forEach((g, i) => {
                generators[i].amount = new BigNum(g.amount.mag, g.amount.exp);
                generators[i].bought = g.bought;
                generators[i].cost = new BigNum(g.cost.mag, g.cost.exp);
                generators[i].prodMult = new BigNum(g.prodMult.mag, g.prodMult.exp);
            });
            update();
        }

        function hardReset() {
            if (confirm("本当に全てのデータを消去しますか？")) {
                localStorage.removeItem("starIdleSave");
                location.reload();
            }
        }

        // UIと購入ロジック (省略せず統合)
        function initUI() {
            const listEl = document.getElementById("gen-list");
            listEl.innerHTML = "";
            generators.forEach((gen, i) => {
                listEl.innerHTML += `
                    <div class="gen-row">
                        <div class="gen-info">
                            <div>Gen ${i+1}</div>
                            <div style="font-size:0.7rem">Amt: <span id="amt-${i}">0</span></div>
                        </div>
                        <div class="btn-group">
                            <button onclick="buyMax(${i}, 10)">Buy 10</button>
                            <button onclick="buyMax(${i}, 999)">Buy Max</button>
                        </div>
                    </div>`;
            });
        }

        function buyMax(i, limit) {
            let g = generators[i];
            let count = 0;
            while (points.gte(g.cost) && count < limit) {
                points.minus(g.cost);
                g.amount.plus(new BigNum(1, 0));
                g.bought++;
                g.cost.times(g.costMult);
                if (g.bought % 10 === 0) g.prodMult.times(2);
                count++;
            }
            update();
        }

        function gameLoop() {
            for (let i = 7; i > 0; i--) {
                let p = BigNum.copy(generators[i].amount).times(generators[i].prodMult).times(0.1);
                generators[i-1].amount.plus(p);
            }
            points.plus(BigNum.copy(generators[0].amount).times(generators[0].prodMult).times(0.1));
            update();
        }

        function update() {
            document.getElementById("display").innerText = points.toString();
            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
            });
        }

        initData();
        initUI();
        loadGame(); // 起動時に自動ロード
        setInterval(gameLoop, 100);
        setInterval(saveGame, 10000); // 10秒ごとに自動セーブ
    </script>
</body>
</html>
