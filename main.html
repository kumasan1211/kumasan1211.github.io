<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Advanced Fixed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="star-canvas"></canvas>
    <div id="save-popup">DATA SAVED</div>
    
    <div id="top-ui">
        <div id="display-container">
            <div id="display">0.00 stars</div>
            <div id="stats-bar">
                <span id="ps-display">+0.00/s</span> | 
                <span id="pow-display">Power: x1.000</span>
            </div>
            <div id="overdrive-text">OVERDRIVE ACTIVE (x1000)</div>
        </div>
        <div class="controls-hint">
            [1-8]:Buy | [M]:Max | [S]:Save | [B]:Sacrifice | [P]:Prestige
        </div>
    </div>

    <div class="gen-list">
        <div id="gen-list-render"></div>
        
        <div class="action-area">
            <button class="btn-base sac-btn" id="sac-btn" onclick="sacrifice()">
                SACRIFICE [B]<br>
                <small id="sac-bonus-text">Require e10 Gen 1</small>
            </button>
            <button class="btn-base prestige-btn" id="prestige-btn" onclick="prestige()">
                PRESTIGE [P]<br>
                <small id="prestige-info-text">Require e38 stars</small>
            </button>
        </div>
        
        <button onclick="hardReset()" class="reset-btn">HARD RESET</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
