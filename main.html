<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle: Full Fixed Edition</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', monospace; text-align: center; margin: 0; padding: 0; }
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #top-ui { position: sticky; top: 0; background: rgba(0, 5, 15, 0.9); padding: 15px 0; z-index: 100; border-bottom: 1px solid #0f04; backdrop-filter: blur(5px); }
        #display-container { background: rgba(0, 10, 20, 0.8); border: 2px solid #0f0; width: 85%; margin: 0 auto; padding: 15px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3rem; font-weight: bold; }
        #stats-bar { font-size: 1rem; color: #0a0; margin-top: 5px; }
        .gen-list { max-width: 750px; margin: 20px auto; padding: 0 20px 100px; }
        .gen-row { display: flex; justify-content: space-between; align-items: center; background: rgba(20, 20, 20, 0.9); margin: 8px 0; padding: 12px 20px; border: 1px solid #333; border-radius: 8px; transition: 0.1s; }
        .gen-row.flash { border-color: #fff; box-shadow: 0 0 15px #fff; transform: scale(1.02); }
        .action-area { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .btn-base { border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; border-radius: 5px; width: 100%; max-width: 400px; transition: 0.2s; }
        .sac-btn { background: #600; color: #f88; border: 1px solid #f00; }
        .prestige-btn { background: #004; color: #88f; border: 1px solid #00f; }
        .buy-btn { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px 15px; cursor: pointer; min-width: 130px; }
        .btn-base:disabled, .buy-btn:disabled { background: #222; color: #444; border-color: #333; cursor: not-allowed; }
        #overdrive-text { color: #f0f; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <canvas id="star-canvas"></canvas>
    <div id="top-ui">
        <div id="display-container">
            <div id="display">0.00 stars</div>
            <div id="stats-bar"><span id="ps-display">+0.00/s</span> | <span id="pow-display">Power: x1.000</span></div>
            <div id="overdrive-text">OVERDRIVE ACTIVE (x1000)</div>
        </div>
        <div style="font-size: 0.75rem; margin-top: 5px; color: #888;">[1-8]:Buy | [M]:Max | [S]:Save | [B]:Sacrifice | [P]:Prestige</div>
    </div>

    <div class="gen-list">
        <div id="gen-list-render"></div>
        <div class="action-area">
            <button class="btn-base sac-btn" id="sac-btn" onclick="sacrifice()">SACRIFICE [B]<br><small id="sac-bonus-text">Next: x1.000 to Gen 8</small></button>
            <button class="btn-base prestige-btn" id="prestige-btn" onclick="prestige()">PRESTIGE [P]<br><small id="prestige-info-text">Require e38 stars</small></button>
        </div>
        <button onclick="hardReset()" style="color:#600; background:none; border:1px solid #300; cursor:pointer; margin-top:50px;">HARD RESET</button>
    </div>

    <script>
        class BigNum {
            constructor(mag, exp) { this.mag = isNaN(mag) ? 0 : mag; this.exp = isNaN(exp) ? 0 : exp; this.normalize(); }
            normalize() {
                if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(Math.abs(this.mag));
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { if(other.mag > 0) { this.mag = other.mag; this.exp = other.exp; } return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(2);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag - 1e-10); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let stars, generators, sacrificeMult, permanentPower, lastUpdate = Date.now(), overdrive = false;

        function initData() {
            stars = new BigNum(1, 1);
            sacrificeMult = new BigNum(1, 0);
            if (permanentPower === undefined) permanentPower = 1.0;
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators[0].amount = new BigNum(1, 0);
        }

        function renderGenerators() {
            const listEl = document.getElementById("gen-list-render");
            listEl.innerHTML = generators.map((_, i) => `
                <div class="gen-row" id="row-${i}">
                    <div><span class="key-badge">${i+1}</span><strong>Gen ${i+1}</strong><br><small id="amt-${i}">0</small></div>
                    <button class="buy-btn" id="buy-btn-${i}" onclick="buy(${i})">Buy (Cost: <span id="cost-${i}">0</span>)</button>
                </div>
            `).join('');
        }

        function buy(i) {
            let g = generators[i];
            if (stars.gte(g.cost)) {
                stars.minus(g.cost); g.amount.plus(new BigNum(1, 0)); g.bought++;
                g.cost.times(g.costMult); if (g.bought % 10 === 0) g.prodMult.times(2);
                if (i === 0) flashRow(0);
                return true;
            } return false;
        }

        function buyMaxAll() {
            for (let i = 7; i >= 0; i--) { let bought = false; while (stars.gte(generators[i].cost)) { buy(i); bought = true; } if (bought) flashRow(i); }
        }

        function sacrifice() {
            let bonus = getSacBonus();
            if (generators[0].amount.exp < 10) return;
            sacrificeMult = bonus;
            for (let i = 0; i < 7; i++) {
                generators[i].amount = new BigNum(0, 0); generators[i].bought = 0;
                generators[i].cost = new BigNum(config[i].base, 0); generators[i].prodMult = new BigNum(1, 0);
            }
            generators[0].amount = new BigNum(1, 0);
            flashRow(7);
        }

        function prestige() {
            let gain = getPrestigeGain();
            if (stars.exp < 38) return;
            permanentPower = gain;
            initData();
        }

        function getSacBonus() {
            let exp = generators[0].amount.exp;
            return (exp < 10) ? new BigNum(1,0) : new BigNum(Math.pow(exp / 10, 2), 0);
        }

        function getPrestigeGain() {
            return stars.exp < 38 ? 1.0 : Math.pow(stars.exp / 64, 0.063);
        }

        window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();
            if (k >= "1" && k <= "8") buy(parseInt(k)-1);
            if (k === "m") buyMaxAll();
            if (k === "b") sacrifice();
            if (k === "p") prestige();
            if (k === "o") overdrive = true;
        });
        window.addEventListener("keyup", (e) => { if (e.key === "o") overdrive = false; });

        function gameLoop() {
            const now = Date.now();
            let diff = Math.min((now - lastUpdate) / 1000, 1);
            lastUpdate = now;
            if (overdrive) { diff *= 1000; document.getElementById("overdrive-text").style.display = "block"; }
            else { document.getElementById("overdrive-text").style.display = "none"; }

            let pPower = permanentPower || 1.0;
            for (let i = 7; i > 0; i--) {
                let m = BigNum.copy(generators[i].prodMult).times(pPower);
                if (i === 7) m.times(sacrificeMult);
                generators[i-1].amount.plus(BigNum.copy(generators[i].amount).times(m).times(diff));
            }
            let gain = BigNum.copy(generators[0].amount).times(generators[0].prodMult).times(pPower);
            stars.plus(BigNum.copy(gain).times(diff));
            updateUI(gain, pPower);
        }

        function updateUI(gain, pPower) {
            document.getElementById("display").innerText = stars.toString() + " stars";
            document.getElementById("ps-display").innerText = "+" + gain.toString() + "/s";
            document.getElementById("pow-display").innerText = "Power: x" + pPower.toFixed(3);
            
            let sacB = getSacBonus();
            document.getElementById("sac-bonus-text").innerText = `Next: x${sacB.toString()} to Gen 8`;
            document.getElementById("sac-btn").disabled = (generators[0].amount.exp < 10);
            
            let pGain = getPrestigeGain();
            document.getElementById("prestige-btn").disabled = (stars.exp < 38);
            document.getElementById("prestige-info-text").innerText = (stars.exp < 38) ? "Require e38 stars" : `Next: x${pGain.toFixed(3)} Power`;

            generators.forEach((gen, i) => {
                document.getElementById(`amt-${i}`).innerText = gen.amount.toString();
                document.getElementById(`cost-${i}`).innerText = gen.cost.toString();
                document.getElementById(`buy-btn-${i}`).disabled = !stars.gte(gen.cost);
            });
        }

        function flashRow(i) {
            const el = document.getElementById(`row-${i}`);
            if(el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 150); }
        }

        function hardReset() { if(confirm("RESET?")){localStorage.clear(); location.reload();} }

        // 初期化
        initData();
        renderGenerators();
        setInterval(gameLoop, 50);

        // 背景Canvas
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.onresize = resize;
        function draw() { ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; for(let i=0;i<50;i++) ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,1,1); requestAnimationFrame(draw); }
        draw();
    </script>
</body>
</html>
