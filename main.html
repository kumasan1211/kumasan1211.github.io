<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Idle</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        #display-container { background: #111; border: 2px solid #0f0; width: 85%; margin: 10px auto; padding: 20px; box-shadow: 0 0 15px #0f04; }
        #display { font-size: 3.5rem; font-weight: bold; }
        .gen-list { max-width: 700px; margin: 0 auto; text-align: left; }
        .gen-row { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #111; margin: 5px 0; padding: 10px; border-bottom: 1px solid #222;
        }
        .key-badge { 
            background: #333; color: #fff; padding: 2px 8px; border-radius: 4px; 
            border: 1px solid #555; margin-right: 10px; font-weight: bold;
        }
        .can-buy { color: #ffcc00; }
        .cant-buy { color: #444; }
        .save-info { font-size: 0.8rem; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="display-container">
        <div style="color: #888; letter-spacing: 2px;">STARS</div>
        <div id="display">0.0</div>
    </div>
    
    <div style="margin: 10px; color: #888;">キーボードの [1] ～ [8] キーで購入</div>

    <div class="gen-list" id="gen-list"></div>

    <div class="save-info">1000秒ごとにオートセーブ中... [R]キーで全データ消去</div>

    <script>
        class BigNum {
            constructor(mag, exp) { this.mag = mag; this.exp = exp; this.normalize(); }
            normalize() {
                if (this.mag <= 1e-15) { this.mag = 0; this.exp = 0; return; }
                let log = Math.log10(this.mag);
                this.exp += Math.floor(log);
                this.mag = Math.pow(10, log - Math.floor(log));
            }
            plus(other) {
                let diff = this.exp - other.exp;
                if (diff > 15) return this;
                if (diff < -15) { this.mag = other.mag; this.exp = other.exp; return this; }
                this.mag = this.mag + other.mag * Math.pow(10, -diff);
                this.normalize(); return this;
            }
            minus(other) {
                if (this.exp > other.exp + 15) return this;
                this.mag -= other.mag * Math.pow(10, other.exp - this.exp);
                if (this.mag < 0) { this.mag = 0; this.exp = 0; }
                this.normalize(); return this;
            }
            times(num) {
                if (num instanceof BigNum) { this.mag *= num.mag; this.exp += num.exp; }
                else { this.mag *= num; }
                this.normalize(); return this;
            }
            toString() {
                if (this.exp >= 100000000) return "ee" + Math.log10(this.exp).toFixed(6);
                if (this.exp >= 3) return this.mag.toFixed(2) + "e" + Math.floor(this.exp).toLocaleString();
                return (this.mag * Math.pow(10, this.exp)).toFixed(1);
            }
            gte(other) { return this.exp > other.exp || (this.exp === other.exp && this.mag >= other.mag); }
            static copy(bn) { return new BigNum(bn.mag, bn.exp); }
        }

        let points = new BigNum(1, 1);
        const config = [{base:2,m:2},{base:16,m:4},{base:512,m:8},{base:65536,m:16},{base:3.35e7,m:32},{base:6.8e10,m:64},{base:5.6e14,m:128},{base:1.8e19,m:256}];
        let generators = [];

        function initData() {
            generators = config.map((c) => ({
                amount: new BigNum(0, 0), bought: 0,
                cost: new BigNum(c.base, 0), costMult: new BigNum(c.m, 0), prodMult: new BigNum(1, 0)
            }));
            generators[0].amount = new BigNum(1, 0);
            points = new BigNum(1, 1);
        }

        // キーボード入力の検知
        window.addEventListener("keydown", (e) => {
            const key = e.key;
            // 1~8キーで購入
            if (key >= "1" && key <= "8") {
                buy(parseInt(key) - 1);
            }
            // Rキーでリセット
            if (key.toLowerCase() === "r") {
                if (confirm("全データを消去しますか？")) {
                    localStorage.removeItem("starSaveKbd");
                    location.reload();
                }
            }
        });

        function buy(i) {
            let g = generators[i];
            if (points.gte(g.cost)) {
                points.minus(g.cost);
                g.amount.plus(new BigNum(1, 0));
                g.bought++;
                g.cost.times(g.costMult);
                if (g.bought % 10 === 0) g.prodMult.times(2);
                update();
            }
        }

        function saveGame() {
            const saveData = {
                p: { m: points.mag, e: points.exp },
                g: generators.map(g => ({
                    a: { m: g.amount.mag, e: g.amount.exp },
                    b: g.bought,
                    c: { m: g.cost.mag, e: g.cost.exp },
                    pm: { m: g.prodMult.mag, e: g.prodMult.exp }
                }))
            };
            localStorage.setItem("starSaveKbd", JSON.stringify(saveData));
        }

        function loadGame() {
            const data = JSON.parse(localStorage.getItem("starSaveKbd"));
            if (!data) return;
            points = new BigNum(data.p.m, data.p.e);
            data.g.forEach((g, i) => {
                generators[i].amount = new BigNum(g.a.m, g.a.e);
                generators[i].bought = g.b;
                generators[i].cost = new BigNum(g.c.m, g.c.e);
                generators[i].prodMult = new BigNum(g.pm.m, g.pm.e);
            });
        }

        function initUI() {
            const listEl = document.getElementById("gen-list");
            listEl.innerHTML = generators.map((_, i) => `
                <div class="gen-row">
                    <div>
                        <span class="key-badge">${i+1}</span>
                        <span>Gen ${i+1}</span>
                    </div>
                    <div id="info-${i}">
                        Amt: 0 | Cost: 0
                    </div>
                </div>
            `).join('');
        }

        function gameLoop() {
            for (let i = 7; i > 0; i--) {
                let p = BigNum.copy(generators[i].amount).times(generators[i].prodMult).times(0.1);
                generators[i-1].amount.plus(p);
            }
            points.plus(BigNum.copy(generators[0].amount).times(generators[0].prodMult).times(0.1));
            update();
        }

        function update() {
            document.getElementById("display").innerText = points.toString();
            generators.forEach((gen, i) => {
                const info = document.getElementById(`info-${i}`);
                const canBuy = points.gte(gen.cost);
                info.className = canBuy ? "can-buy" : "cant-buy";
                info.innerText = `Amt: ${gen.amount.toString()} | Cost: ${gen.cost.toString()}`;
            });
        }

        initData();
        initUI();
        loadGame();
        setInterval(gameLoop, 100);
        setInterval(saveGame, 1000000);
    </script>
</body>
</html>
