<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Star Ultimate v4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="star-canvas"></canvas>

    <div id="game-container">
        <header>
            <h1 id="display">0.00 stars</h1>
            <p id="ps-display">+0.00/s</p>
            <p id="pow-display">Power: x1.00 | Boost: x1.00</p>
        </header>

        <div class="tabs">
            <!-- Boost Section -->
            <div id="boost-container" class="special-row">
                <div class="info">
                    <strong>Star Boost (Lv <span id="boost-level">0</span>)</strong>
                    <small>全体の生産量を x2.00 します [Rキー]</small>
                </div>
                <button id="boost-btn" class="buy-btn" onclick="buyBoost()">
                    Boost! (Cost: <span id="boost-cost">1.00e5</span>)
                </button>
            </div>

            <!-- Prestige / Sacrifice Section -->
            <div class="prestige-row">
                <button id="sac-btn" onclick="sacrifice()">
                    Sacrifice [B]<br>
                    <small id="sac-bonus-text">Require e10 Gen 1</small>
                </button>
                <button id="prestige-btn" onclick="prestige()">
                    Prestige [P]<br>
                    <small id="prestige-info-text">Require e38 stars</small>
                </button>
            </div>
        </div>

        <div id="gen-list-render">
            <!-- JSで生成されます -->
        </div>

        <div class="controls">
            <button onclick="buyMaxAll()">Buy Max [M]</button>
            <button onclick="saveGame(true)">Save [S]</button>
            <button onclick="hardReset()" style="background:#422;">Hard Reset</button>
        </div>
        <p id="overdrive-text" style="color:red; display:none;">OVERDRIVE ACTIVE (x1000)</p>
    </div>

    <div id="save-popup">Saved!</div>

    <script src="main.js"></script>
</body>
</html>
