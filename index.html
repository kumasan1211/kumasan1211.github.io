<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Idle: Enhanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="star-canvas"></canvas>
    <div id="save-popup">DATA SAVED</div>

    <!-- 上部固定UI -->
    <header id="top-ui">
        <div id="display-container">
            <div id="display">0.00 stars</div>
            <div id="stats-bar">
                <span id="ps-display">+0.00/s</span> | 
                <span id="pow-display">Prestige Power: x1.000</span>
            </div>
            <div id="overdrive-text">OVERDRIVE ACTIVE (x1000)</div>
        </div>
        <nav class="key-guide">
            [1-8]:Buy | [M]:Max | [S]:Save | [B]:Sacrifice | [P]:Prestige
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="game-content">
        <div id="gen-list-render">
            <!-- JavaScriptで動的に生成されます -->
        </div>

        <section class="action-area">
            <button class="btn-base sac-btn" id="sac-btn" onclick="sacrifice()">
                <span class="btn-label">SACRIFICE [B]</span>
                <small id="sac-bonus-text">Require e10 Gen 1</small>
            </button>
            
            <button class="btn-base prestige-btn" id="prestige-btn" onclick="prestige()">
                <span class="btn-label">PRESTIGE [P]</span>
                <small id="prestige-info-text">Require e30 stars</small>
            </button>
        </section>

        <footer>
            <button onclick="hardReset()" class="reset-link">HARD RESET</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
